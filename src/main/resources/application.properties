server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
# Reject 10.5 for an amount in minor units instead of silently truncating it to 10
spring.jackson.deserialization.accept-float-as-int=false

payments.supported-currencies=GBP,USD,EUR

bank.base-url=http://localhost:8080
bank.connect-timeout=2s
# Long enough for a normal authorisation, short enough not to hold the merchant's request open
bank.read-timeout=5s

# Adds the request id to every log line in the default text format
logging.pattern.level=%5p [%X{request_id:-}]

management.endpoints.web.exposure.include=health,info,prometheus
# Histogram buckets let Prometheus work out p95/p99 latency across instances
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.bank.authorizations=true
management.endpoint.health.probes.enabled=true
# Shutdown is graceful by default. This gives a payment already waiting on the bank time to
# finish: the bank read timeout plus a margin.
spring.lifecycle.timeout-per-shutdown-phase=10s
