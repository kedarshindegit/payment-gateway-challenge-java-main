version: "3.8"

services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters
    networks:
      default:
        # Java's HTTP client rejects host names containing "_", so the gateway uses this alias.
        aliases:
          - bank-simulator

  payment_gateway:
    container_name: payment_gateway
    build: .
    ports:
      - "8090:8090"
    environment:
      BANK_BASE_URL: http://bank-simulator:8080
    depends_on:
      - bank_simulator
