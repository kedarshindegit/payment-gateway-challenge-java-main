name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build, unit and integration tests, coverage check
        run: ./gradlew build

      - name: End-to-end tests against the bank simulator
        run: ./gradlew e2eTest

      - name: Build Docker image
        run: docker build -t payment-gateway .

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports/
